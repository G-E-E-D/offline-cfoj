<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 140" width="320" height="140">
  <rect width="320" height="140" rx="12" fill="#0f172a"/>
  <circle cx="95" cy="70" r="46" fill="#16a34a" stroke="#bbf7d0" stroke-width="3"/>
  <circle cx="95" cy="70" r="38" fill="#ef4444"/>
  <line x1="95" y1="24" x2="95" y2="116" stroke="#fef08a" stroke-width="3" stroke-dasharray="5,4"/>
  <text x="72" y="75" fill="#ffffff" font-family="monospace" font-size="14" font-weight="bold">2 kg</text>
  <text x="102" y="75" fill="#ffffff" font-family="monospace" font-size="14" font-weight="bold">6 kg</text>
  <text x="165" y="55" fill="#e2e8f0" font-family="sans-serif" font-size="13">w = 8 kg (even &gt; 2)</text>
  <text x="165" y="80" fill="#86efac" font-family="monospace" font-size="13">8 = 2 + 6 (both even)</text>
  <text x="165" y="102" fill="#94a3b8" font-family="sans-serif" font-size="11">w = 2 -&gt; 1 + 1 (odd: NO)</text>
</svg>
